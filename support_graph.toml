[dataset]
root = "multidoc2dial"
enabled_domains = ["dmv"]

[paths]
eval_runs_dir = "outputs/evals/runs"
eval_reports_dir = "outputs/evals/reports"
runs_dir = "outputs/runs"
log_dir = "logs"
log_level = "INFO"

[runtime]
provider_type = "openrouter"
ollama_base_url = "http://localhost:11434"
openrouter_base_url = "https://openrouter.ai/api/v1"
chat_model = "arcee-ai/trinity-large-preview:free"
embedding_model = "qwen/qwen3-embedding-8b"
prompt_version = "v1"
retrieval_top_k = 5
retrieval_candidate_k = 12
max_retrieval_attempts = 2
llm_max_concurrency = 4
llm_max_retries = 3
llm_retry_base_delay_seconds = 0.5
llm_retry_max_delay_seconds = 4.0

[observability.langsmith]
tracing_enabled = false
project = "support-graph"
endpoint = ""

[observability.otel]
enabled = false
service_name = "support-graph"
exporter = "otlp"
endpoint = ""
