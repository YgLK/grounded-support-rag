<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_title }} | SupportGraph Workbench</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
      integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
      crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.0/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
    <style>
      :root {
        --sg-bg: #f4f6f9;
        --sg-surface: #ffffff;
        --sg-border: rgba(38, 50, 56, 0.12);
        --sg-ink: #1f2933;
        --sg-muted: #5b6977;
        --sg-mono: "SFMono-Regular", "Menlo", "Monaco", "Consolas", monospace;
        --sg-sans: "Instrument Sans", "Segoe UI", sans-serif;
      }

      [x-cloak] { display: none !important; }

      body {
        background:
          radial-gradient(circle at top left, rgba(45, 157, 219, 0.08), transparent 28%),
          radial-gradient(circle at top right, rgba(22, 160, 133, 0.08), transparent 32%),
          linear-gradient(180deg, #f8fafc 0%, var(--sg-bg) 100%);
        color: var(--sg-ink);
        font-family: var(--sg-sans);
      }

      .navbar-brand-wordmark {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.1rem;
        letter-spacing: 0.02em;
      }

      .page-subtitle {
        max-width: 72ch;
        color: var(--sg-muted);
      }

      .mono,
      .path-code,
      .query-code,
      .json-block code,
      code {
        font-family: var(--sg-mono);
      }

      .path-code {
        white-space: normal;
        word-break: break-all;
      }

      .metric-card,
      .evidence-panel,
      .detail-hero,
      .timeline-panel,
      .chunk-comparison,
      .console-panel {
        border: 1px solid var(--sg-border);
        box-shadow: 0 12px 35px rgba(15, 23, 42, 0.04);
      }

      .metric-label {
        font-size: 0.78rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--sg-muted);
      }

      .metric-value {
        margin-top: 0.35rem;
        font-size: 1.6rem;
        font-weight: 700;
      }

      .metric-note {
        margin-top: 0.35rem;
        color: var(--sg-muted);
        font-size: 0.84rem;
      }

      .status-answer,
      .status-clarify,
      .status-abstain,
      .status-warning,
      .status-failure,
      .status-runtime-error,
      .status-neutral {
        border: 1px solid transparent;
      }

      .status-answer { background: rgba(46, 204, 113, 0.12); color: #17613a; border-color: rgba(46, 204, 113, 0.24); }
      .status-clarify { background: rgba(241, 196, 15, 0.15); color: #7a5d00; border-color: rgba(241, 196, 15, 0.28); }
      .status-abstain { background: rgba(52, 73, 94, 0.12); color: #334155; border-color: rgba(52, 73, 94, 0.22); }
      .status-warning { background: rgba(230, 126, 34, 0.12); color: #8a4a12; border-color: rgba(230, 126, 34, 0.24); }
      .status-failure { background: rgba(231, 76, 60, 0.12); color: #8d2a20; border-color: rgba(231, 76, 60, 0.24); }
      .status-runtime-error { background: rgba(142, 68, 173, 0.12); color: #5e3374; border-color: rgba(142, 68, 173, 0.24); }
      .status-neutral { background: rgba(148, 163, 184, 0.14); color: #475569; border-color: rgba(148, 163, 184, 0.24); }

      .hero-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1rem;
      }

      .chunk-text,
      .query-code,
      .json-block,
      .response-block {
        background: rgba(248, 250, 252, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 0.6rem;
        padding: 0.8rem 0.9rem;
      }

      .chunk-text,
      .response-block {
        white-space: pre-wrap;
      }

      .json-block {
        margin: 0;
        max-height: 18rem;
        overflow: auto;
        font-size: 0.78rem;
      }

      .trace-stack {
        display: grid;
        gap: 0.85rem;
      }

      .trace-event {
        border: 1px solid var(--sg-border);
        border-radius: 0.8rem;
        padding: 0.9rem;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(247, 249, 252, 0.98));
      }

      .timeline-list {
        display: grid;
        gap: 0.75rem;
      }

      .timeline-item {
        border-left: 3px solid rgba(37, 99, 235, 0.18);
        padding-left: 0.85rem;
      }

      .summary-html h1,
      .summary-html h2,
      .summary-html h3 {
        margin-top: 1.2rem;
      }

      .summary-html table {
        width: 100%;
      }

      .summary-html pre {
        background: rgba(248, 250, 252, 0.95);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 0.6rem;
        padding: 0.8rem;
        overflow: auto;
      }

      .filters-bar {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--sg-border);
        border-radius: 1rem;
        padding: 1rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
      }
    </style>
    <script>
      window.SupportGraphWorkbench = {
        liveRun(streamUrl, runPath) {
          return {
            streamUrl,
            runPath,
            status: "connecting",
            source: null,
            timeline: [],
            milestones: [],
            query: "",
            retrievalAttempts: 0,
            rankedChunks: [],
            retrievedChunks: [],
            evidenceGrade: null,
            responseText: "",
            decision: "",
            confidence: "",
            citations: [],
            traceSummary: null,
            error: "",
            completed: false,
            defaultMilestones() {
              return [
                { key: "prepare_query", label: "Prepare query", status: "pending", note: "Waiting for query construction." },
                { key: "retrieve_docs", label: "Retrieve docs", status: "pending", note: "Waiting for ranked retrieval." },
                { key: "grade_evidence", label: "Grade evidence", status: "pending", note: "Waiting for evidence review." },
                { key: "response", label: "Build response", status: "pending", note: "Waiting for answer, clarify, or abstain output." },
                { key: "finalize", label: "Finalize run", status: "pending", note: "Waiting for final trace summary." },
              ];
            },
            updateMilestone(key, status, note) {
              const item = this.milestones.find((milestone) => milestone.key === key);
              if (!item) {
                return;
              }
              item.status = status;
              if (note) {
                item.note = note;
              }
            },
            milestoneTone(status) {
              return {
                done: "status-answer",
                active: "status-warning",
                error: "status-failure",
              }[status] || "status-neutral";
            },
            connect() {
              this.reset();
              this.updateMilestone(
                "prepare_query",
                "active",
                "Building the initial query from the latest user turn."
              );
              this.status = "streaming";
              this.source = new EventSource(this.streamUrl);
              this.source.onmessage = (message) => {
                const event = JSON.parse(message.data);
                this.applyEvent(event);
              };
              this.source.onerror = () => {
                if (this.completed || this.error) {
                  if (this.source) {
                    this.source.close();
                  }
                  return;
                }
                this.status = "connection-lost";
              };
            },
            reset() {
              this.timeline = [];
              this.milestones = this.defaultMilestones();
              this.query = "";
              this.retrievalAttempts = 0;
              this.rankedChunks = [];
              this.retrievedChunks = [];
              this.evidenceGrade = null;
              this.responseText = "";
              this.decision = "";
              this.confidence = "";
              this.citations = [];
              this.traceSummary = null;
              this.error = "";
              this.completed = false;
            },
            pushTimeline(event) {
              this.timeline.unshift({
                kind: event.kind,
                node: event.node || "",
                payload: JSON.stringify(event, null, 2),
              });
              this.timeline = this.timeline.slice(0, 30);
            },
            applyEvent(event) {
              this.pushTimeline(event);
              if (event.kind === "query_ready" || event.kind === "query_refined") {
                const query = event.refined_query || event.query || "";
                this.query = query;
                this.updateMilestone("prepare_query", "done", query || "Query ready.");
                this.updateMilestone(
                  "retrieve_docs",
                  "active",
                  "Retrieving ranked candidates and expanding evidence."
                );
                return;
              }
              if (event.kind === "retrieval_complete") {
                this.retrievalAttempts = event.retrieval_attempts || 0;
                this.rankedChunks = event.retrieval_ranked_chunks || [];
                this.retrievedChunks = event.retrieved_chunks || [];
                this.updateMilestone(
                  "retrieve_docs",
                  "done",
                  `${this.rankedChunks.length} ranked / ${this.retrievedChunks.length} expanded`
                );
                this.updateMilestone(
                  "grade_evidence",
                  "active",
                  "Reviewing whether the evidence supports an answer."
                );
                return;
              }
              if (event.kind === "evidence_graded") {
                this.evidenceGrade = event.evidence_grade || null;
                const verdict = this.evidenceGrade && this.evidenceGrade.verdict
                  ? this.evidenceGrade.verdict
                  : "Evidence graded";
                this.updateMilestone("grade_evidence", "done", verdict);
                this.updateMilestone(
                  "response",
                  "active",
                  "Preparing the final answer, clarification, or abstention."
                );
                return;
              }
              if (event.kind === "response_started") {
                this.decision = event.decision || this.decision;
                this.responseText = "";
                this.updateMilestone("response", "active", event.decision || "Generating response.");
                return;
              }
              if (event.kind === "response_delta") {
                this.responseText += event.delta || "";
                return;
              }
              if (event.kind === "response_completed") {
                this.completed = true;
                this.status = "completed";
                this.decision = event.decision || this.decision;
                this.responseText = event.response_text || this.responseText;
                this.citations = event.citations || [];
                this.confidence = event.confidence_label || "";
                this.traceSummary = event.trace_summary || null;
                this.updateMilestone("response", "done", event.decision || "Response completed.");
                this.updateMilestone(
                  "finalize",
                  "done",
                  this.traceSummary && this.traceSummary.graph_path
                    ? this.traceSummary.graph_path.join(" -> ")
                    : "Trace summary ready."
                );
                if (this.source) {
                  this.source.close();
                }
                return;
              }
              if (event.kind === "fallback") {
                this.updateMilestone(
                  "response",
                  "active",
                  "Fallback handling was used while building the response."
                );
                return;
              }
              if (event.kind === "error") {
                this.error = event.error || "Live run failed.";
                this.status = "error";
                this.updateMilestone("finalize", "error", this.error);
                if (this.source) {
                  this.source.close();
                }
              }
            },
          };
        },
      };
    </script>
  </head>
  <body>
    <div class="page">
      <header class="navbar navbar-expand-md sticky-top d-print-none">
        <div class="container-xl">
          <a class="navbar-brand navbar-brand-autodark pe-3" href="/">
            <span class="navbar-brand-wordmark">SupportGraph Workbench</span>
          </a>
          <div class="navbar-nav gap-2">
            <a class="nav-link {% if active_nav == 'artifacts' %}active{% endif %}" href="/">Artifacts</a>
            <a class="nav-link {% if active_nav == 'live' %}active{% endif %}" href="/live">Live Run</a>
          </div>
        </div>
      </header>
      <div class="page-wrapper">
        <div class="page-header d-print-none">
          <div class="container-xl">
            <div class="row g-2 align-items-center">
              <div class="col">
                <h2 class="page-title">{{ page_title }}</h2>
                <div class="page-subtitle">
                  Workbench views read the existing run, eval, report, and trace artifacts directly.
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="page-body">
          <div class="container-xl">
            {% block content %}{% endblock %}
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
