services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grounded-support-rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: support_graph
    ports:
      - "5432:5432"
    volumes:
      - support_graph_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d support_graph"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  support_graph_postgres_data:
