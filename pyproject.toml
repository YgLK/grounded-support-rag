[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-graph"
version = "0.1.0"
description = "CLI-first SupportGraph MVP over MultiDoc2Dial"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.2.19",
    "langchain-ollama>=1.0.1",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.1.2",
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.3.3",
    "tenacity>=9.1.4",
    "sacrebleu>=2.6.0",
    "langchain>=1.2.12",
    "langchain-openai>=1.1.11",
    "opentelemetry-api>=1.40.0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "fastapi>=0.135.1",
    "markdown>=3.10.2",
    "jinja2>=3.1.6",
    "uvicorn>=0.42.0",
    "python-dotenv>=1.2.2",
    "stop-words>=2025.11.4",
]

[project.scripts]
support-graph = "support_graph.app.cli:main"

[tool.setuptools.packages.find]
include = ["support_graph*"]

[tool.setuptools.package-data]
"support_graph.ui" = ["templates/**/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=support_graph --cov-report=term-missing"
markers = [
    "integration: tests that require live Postgres and Ollama services",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
