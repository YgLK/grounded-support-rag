[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-support-rag"
version = "0.1.0"
description = "CLI-first SupportGraph MVP over Kubernetes docs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.2.19",
    "langchain-ollama>=1.0.1",
    "langchain-postgres>=0.0.17",
    "langgraph>=1.1.2",
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.3.3",
    "tenacity>=9.1.4",
    "sacrebleu>=2.6.0",
    "langchain>=1.2.12",
    "langchain-openai>=1.1.11",
    "fastapi>=0.135.1",
    "markdown>=3.10.2",
    "jinja2>=3.1.6",
    "uvicorn>=0.42.0",
    "python-dotenv>=1.2.2",
    "stop-words>=2025.11.4",
    "langchain-community>=0.4.1",
    "rank-bm25>=0.2.2",
    "tqdm>=4.67.3",
    "langsmith>=0.7.20",
]

[project.scripts]
grounded-support-rag = "support_graph.cli.handlers:main"

[tool.setuptools.packages.find]
include = ["support_graph*"]

[tool.setuptools.package-data]
"support_graph.ui" = ["templates/**/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=support_graph --cov-report=term-missing"
markers = [
    "integration: tests that require live Postgres and Ollama services",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]
